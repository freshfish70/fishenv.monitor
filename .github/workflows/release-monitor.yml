name: Release monitor
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches deno.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r .version deno.json)"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error file=deno.json,line=3::tag ${GITHUB_REF_NAME} implies version ${tag_version}, but deno.json says ${manifest_version}"
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          mkdir -p dist
          deno bundle --minify --output dist/monitor.js main.ts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/monitor.js --clobber
          else
            gh release create "$tag" dist/monitor.js \
              --title "fishenv-monitor v${version}" \
              --generate-notes
          fi
